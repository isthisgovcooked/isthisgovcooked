name: GovCooked Agent — BUDGET DAY 🚨

on:
  workflow_dispatch:
    inputs:
      budget_year:
        description: 'Budget year (e.g. 2025-26)'
        required: true
      budget_url:
        description: 'Budget Papers URL'
        required: true
        default: 'https://budget.gov.au'

jobs:
  budget-day-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Budget Papers
        run: npx tsx scripts/agent/fetch-budget.ts
        env:
          BUDGET_URL: ${{ inputs.budget_url }}
          BUDGET_YEAR: ${{ inputs.budget_year }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate full analysis
        run: npx tsx scripts/agent/generate-analysis.ts
        env:
          BUDGET_YEAR: ${{ inputs.budget_year }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Create Budget Day PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🚨 BUDGET DAY: ${{ inputs.budget_year }} analysis"
          branch: agent/budget-${{ inputs.budget_year }}
          title: "🚨 BUDGET DAY ANALYSIS — ${{ inputs.budget_year }}"
          body: |
            ## Budget Day Analysis — ${{ inputs.budget_year }}

            Generated by GovCooked AI Agent immediately after budget release.

            ### Pre-publish checklist
            - [ ] Key figures match Budget Paper No. 1 tables
            - [ ] No political bias in any explanation level
            - [ ] All three explanation levels (kid/teen/expert) complete
            - [ ] Deception multiplier recalculated with any new promises
            - [ ] Book tricks section complete
            - [ ] Red flags section accurate
            - [ ] Cooked Metre updated

            **This should be reviewed and merged within 2 hours of budget release.**
          labels: budget-day, urgent
