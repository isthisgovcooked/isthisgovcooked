name = "isthisgovcooked"
main = "chat-proxy.js"
compatibility_date = "2024-01-01"

# KV namespace for rate limiting
# Create this in Cloudflare dashboard: Workers → KV → Create namespace "RATE_LIMIT_KV"
# Then paste the ID below
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "6c2b528a5ee3402395b974fd42f11211"

# Environment variables — set secret via CLI:
# npx wrangler secret put GROQ_API_KEY
# (never put the actual key in this file)


